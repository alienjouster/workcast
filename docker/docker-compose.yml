version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
      Anthropic__Model: claude-sonnet-4-5
      ASPNETCORE_URLS: http://+:8080
    # Playwright browsers are baked into the mcr.microsoft.com/playwright/dotnet base image.
    # A bind-mount over /ms-playwright would shadow those binaries, so the volume is omitted here.
    # Docker layer caching avoids re-downloading browsers on rebuild as long as the base image tag
    # does not change.
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  # web service is enabled by Agent 5 once the Next.js app exists in web/
